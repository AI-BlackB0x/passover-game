<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>פסח של מספרים!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">
  <div class="confetti" id="confetti"></div>

  <div class="topbar">
    <div class="brand"><span>📜</span><span>פסח של מספרים!</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <button class="chip chipBtn" id="narrationToggle">קריינות: פועלת 🔊</button>
      <div class="chip" id="scoreChip">⭐ ניקוד: 0</div>
    </div>
  </div>

  <div class="content">
    <div class="card" id="mainCard"></div>
    <div class="progressWrap">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="progressText" id="progressText">מוכנים?</div>
    </div>
    <div class="footerNote">הערה: במובייל הקריינות מתחילה לאחר לחיצה ראשונה על "התחל משחק".</div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
